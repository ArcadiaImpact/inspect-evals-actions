name: Register Lint

on:
  schedule:
    - cron: "17 5 * * *"  # Run daily at 05:17 UTC
  push:
    branches: [main]
    paths:
      - scripts/register_lint/**
      - tests/test_register_lint*.py
      - .github/workflows/register-lint.yml
      - pyproject.toml
      - uv.lock
  pull_request:
    paths:
      - scripts/register_lint/**
      - tests/test_register_lint*.py
      - .github/workflows/register-lint.yml
      - pyproject.toml
      - uv.lock
  workflow_dispatch:
    inputs:
      filter:
        description: Only lint entries whose id matches this glob (default all)
        type: string
        required: false
      publish:
        description: Publish a complete run to the register-lint branch
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: register-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Test the collector and publication boundary
        run: uv run --locked --group register-lint --python 3.12 python -m pytest tests

  lint:
    needs: test
    # Scheduled and manual collection only runs in the operations repository.
    if: github.repository_id == '1101026249' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the current register
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UKGovernmentBEIS/inspect_evals
          ref: main
          path: registry
          sparse-checkout: register
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Lint pinned upstream commits without executing their code
        env:
          FILTER: ${{ inputs.filter }}
          RUNNER_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          filter_args=()
          if [ -n "$FILTER" ]; then
            filter_args=(--filter "$FILTER")
          fi
          registry_commit=$(git -C registry rev-parse HEAD)
          uv run --locked --group register-lint --python 3.12 \
            python -m scripts.register_lint.collect \
              --register-dir registry/register \
              --registry-commit "$registry_commit" \
              --runner-commit "$RUNNER_COMMIT" \
              --output-dir register-lint-artifact \
              "${filter_args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: register-lint-results
          path: register-lint-artifact/results.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: lint
    # A filtered run must never replace the published register.
    if: >-
      github.repository_id == '1101026249' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || (inputs.publish && inputs.filter == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Publish only to this repository's results branch.
    steps:
      # This is the reviewed operations commit on main. No registry or
      # upstream evaluation checkout enters the publisher job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: register-lint-results
          path: register-lint-artifact
      - name: Validate JSON and generate public files
        env:
          BADGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/register-lint
        run: |
          python3 -m scripts.register_lint.publish \
            --artifact-dir register-lint-artifact \
            --output-dir register-lint-output \
            --badge-base-url "$BADGE_BASE_URL"
          cat register-lint-output/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish within the operations repository
        working-directory: register-lint-output
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q -b register-lint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md summary.json results badges
          git commit -q -m "Register lint results for ${SOURCE_SHA} [skip ci]"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" \
            HEAD:refs/heads/register-lint
