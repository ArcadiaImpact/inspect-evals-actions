---
name: Smoke Test (Windows)

"on":
  workflow_dispatch:
    inputs:
      inspect_evals_ref:
        description: "inspect_evals branch/tag/commit to checkout"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 14 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# zizmor: excessive-permissions (https://docs.zizmor.sh/audits/#excessive-permissions)
permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONUTF8: "1"

jobs:
  smoke-test-windows:
    name: Smoke test (Windows)
    runs-on: windows-latest-8-cores
    steps:
      - name: Checkout inspect_evals repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UKGovernmentBEIS/inspect_evals
          ref: ${{ inputs.inspect_evals_ref || '' }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          prune-cache: false

      - name: Cache Hugging Face datasets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-datasets-${{ runner.os }}-py3.11-${{ hashFiles('uv.lock') }}

      - name: Cache Kaggle TOS verification
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/inspect_evals/mle_bench/tos_accepted
          key: kaggle-tos-${{ runner.os }}-v1

      - name: Install dependencies
        shell: bash
        run: |
          uv sync --frozen --group dev --group test_py311_or_lower --group test

      - name: Run test
        env:
          REQUIRE_HF_ACCESS: "1"
        shell: pwsh
        run: |
          uv run python tools/run_evals.py `
            --no-fail-fast `
            --eval-timeout-mins 15 `
            --clean-after-chunk `
          2>&1 | Tee-Object smoke_output.log
          exit 0

      - name: Upload smoke output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-output
          path: smoke_output.log

  summarise-smoke:
    name: Summarise smoke tests (Windows)
    needs: smoke-test-windows
    runs-on: windows-latest-8-cores

    steps:
      - name: Checkout inspect-evals-actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download smoke output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smoke-test-output
          path: .

      - name: Generate summary
        id: summary
        if: always()
        shell: bash
        run: |
          ./scripts/smoke/summarise_smoke_test_log.sh \
            smoke_output.log \
            "Smoke Test Summary (Windows)" \
          > smoke_summary.txt

      - name: Notify slack if there are unexpected failures
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: ${{ always() && (steps.summary.conclusion == 'failure') }}
        shell: bash
        run: |
          ./scripts/send_to_slack.sh smoke_summary.txt "$SLACK_WEBHOOK_URL"

      - name: Annotate run
        # One error or warning per failing task on the run page, plus a
        # job summary table. The summary step above decides pass or fail.
        if: always()
        shell: bash
        run: |
          python scripts/smoke/annotate_smoke_log.py \
            smoke_output.log \
            "Smoke Test Summary (Windows)"

      - name: Find stale skips
        id: stale
        if: always()
        shell: bash
        run: |
          ./scripts/smoke/find_stale_skips.sh \
            smoke_output.log \
            "Tasks With Out-Of-Date Skips (Windows)" \
          > stale_skips.txt

      - name: Notify slack if there are stale skip marks
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: ${{ always() && (steps.stale.conclusion == 'failure') }}
        shell: bash
        run: |
          ./scripts/send_to_slack.sh stale_skips.txt "$SLACK_WEBHOOK_URL"

      - name: Triage failed scheduled smoke test
        if: ${{ always() && github.event_name == 'schedule' && (steps.summary.conclusion == 'failure' || steps.stale.conclusion == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.CI_TRIAGE_DISPATCH_TOKEN }}
          STALE_CONCLUSION: ${{ steps.stale.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          # Denied Hugging Face access needs the terms accepted, not a code fix.
          # Skip the agent unless some task has an unexpected error or the stale-skip check failed.
          if ! grep -q "is not considered" smoke_output.log && [[ "$STALE_CONCLUSION" != "failure" ]]; then
            echo "No unexpected errors or stale skips; skipping triage dispatch"
            exit 0
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo "CI_TRIAGE_DISPATCH_TOKEN is required" >&2
            exit 1
          fi
          gh api -X POST \
            repos/Generality-Labs/bienehito-experimental/dispatches \
            -f event_type=triage \
            -f "client_payload[prompt]=Triage failing nightly CI job 'Summarise smoke tests (Windows)' in https://github.com/ArcadiaImpact/inspect-evals-actions/actions/runs/$GITHUB_RUN_ID"
