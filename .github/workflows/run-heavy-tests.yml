---
name: Heavy Tests

"on":
  workflow_dispatch:
    inputs:
      inspect_evals_ref:
        description: "inspect_evals branch/tag/commit to checkout"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 2 * * 1,3,5"  # Mon/Wed/Fri at 02:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# zizmor: excessive-permissions (https://docs.zizmor.sh/audits/#excessive-permissions)
permissions:
  contents: read

env:
    HF_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
    KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

jobs:
  heavy-tests:
    name: Heavy tests (full suite)
    runs-on: ubuntu-latest-16-cores
    timeout-minutes: 180
    env:
      REQUIRE_HF_ACCESS: "1"
      RUN_SLOW_TESTS: yes
      RUN_DATASET_DOWNLOAD_TESTS: yes
      TRACE_DOCKER_BUILDS: yes
      SLOW_TEST_THRESHOLD: 10.0  # seconds
    steps:
      - name: Checkout inspect_evals repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UKGovernmentBEIS/inspect_evals
          ref: ${{ inputs.inspect_evals_ref || '' }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-3.11-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-3.11-
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          uv sync --frozen --group dev --group test_py311_or_lower --group test

      - name: Run full test suite with report log
        id: tests
        run: |
          uv run pytest -n 2 --dist=loadgroup -rA --color=yes \
            --durations=20 \
            --report-log=pytest-report.jsonl \
            --ignore=tests/kernelbench \
            --ignore=tests/novelty_bench \
            --ignore=tests/livebench \
            --ignore=tests/mle_bench \
            --ignore=tests/cve_bench \
            --ignore=tests/bold \
            --ignore=tests/abstention_bench \
            tests/

      - name: Detect tests >=10s that are missing @pytest.mark.slow
        id: slow_check
        if: always()
        run: |
          uv run python - <<'PY'
          import json, sys, os
          THRESHOLD = float(os.environ.get('SLOW_TEST_THRESHOLD', '10.0'))
          report = 'pytest-report.jsonl'
          offenders = []
          with open(report, 'r') as f:
              for line in f:
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  if obj.get('$report_type') != 'TestReport':
                      continue
                  if obj.get('when') != 'call':
                      continue
                  # Skip skipped tests
                  if obj.get('outcome') == 'skipped':
                      continue
                  dur = float(obj.get('duration') or 0.0)
                  kw = obj.get('keywords') or {}
                  # keywords is a dict of names -> True
                  is_slow = 'slow' in kw
                  if dur >= THRESHOLD and not is_slow:
                      offenders.append((dur, obj.get('nodeid', '<unknown>')))
          offenders.sort(reverse=True)
          with open('unmarked_slow_tests.txt', 'w') as out:
              for dur, nodeid in offenders:
                  out.write(f"{dur:.2f}s\t{nodeid}\n")
          if offenders:
              print('\nFound tests taking >= 10s without @pytest.mark.slow:')
              for dur, nodeid in offenders:
                  print(f" - {dur:.2f}s  {nodeid}")
              sys.exit(1)
          else:
              print('No unmarked slow tests found (>= 10s).')
          PY

      - name: Detect tests using Docker that are missing @pytest.mark.docker
        id: docker_check
        if: always()
        run: |
          uv run python - <<'PY'
          import json, sys, os
          build_file = '.docker_build_tests.txt'
          compose_file = '.docker_compose_tests.txt'
          used = set()
          for path in (build_file, compose_file):
              if os.path.exists(path):
                  with open(path, 'r') as f:
                      for line in f:
                          nodeid = line.strip()
                          if nodeid:
                              used.add(nodeid)
          if not used:
              print('No docker usage detected (or trace files empty); skipping docker marker check.')
              sys.exit(0)
          # Map nodeid -> keywords from pytest report
          report = 'pytest-report.jsonl'
          keywords = {}
          try:
              with open(report, 'r') as f:
                  for line in f:
                      try:
                          obj = json.loads(line)
                      except Exception:
                          continue
                      if obj.get('$report_type') != 'TestReport':
                          continue
                      if obj.get('when') != 'call':
                          continue
                      if obj.get('outcome') == 'skipped':
                          continue
                      nodeid = obj.get('nodeid')
                      if nodeid:
                          keywords[nodeid] = obj.get('keywords') or {}
          except FileNotFoundError:
              print('pytest-report.jsonl not found; cannot verify docker markers.')
              sys.exit(0)

          offenders = sorted([n for n in used if 'docker' not in (keywords.get(n) or {})])
          with open('unmarked_docker_tests.txt', 'w') as out:
              for n in offenders:
                  out.write(f"{n}\n")
          if offenders:
              print('\nFound tests that used Docker but are missing @pytest.mark.docker:')
              for n in offenders:
                  print(f" - {n}")
              sys.exit(1)
          else:
              print('All Docker-using tests are correctly marked with @pytest.mark.docker.')
          PY

      - name: Checkout inspect-evals-actions scripts
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: inspect-evals-actions
          sparse-checkout: scripts/heavy
          persist-credentials: false

      - name: Classify failures (Hugging Face access denied vs other)
        id: classify
        if: always()
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          import uuid

          result = subprocess.run(
              [
                  sys.executable,
                  "inspect-evals-actions/scripts/heavy/classify_failures.py",
                  "pytest-report.jsonl",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          classified = json.loads(result.stdout)
          denied = classified["access_denied"]
          lines = "\n".join(
              f"{d['repo_id']} https://huggingface.co/datasets/{d['repo_id']}"
              if d["repo_id"]
              else f"unknown ({d['node_id']})"
              for d in denied
          )
          delimiter = f"EOF_{uuid.uuid4().hex}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"access_denied_count={len(denied)}\n")
              out.write(f"other_count={len(classified['other_failures'])}\n")
              out.write(f"access_denied_lines<<{delimiter}\n{lines}\n{delimiter}\n")

      - name: Upload timing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heavy-test-reports
          path: |
            pytest-report.jsonl
            unmarked_slow_tests.txt
            .docker_build_tests.txt
            .docker_compose_tests.txt
            unmarked_docker_tests.txt

      - name: Notify Slack on scheduled failure
        if: ${{ always() && (steps.tests.outcome == 'failure' || steps.slow_check.outcome == 'failure' || steps.docker_check.outcome == 'failure') && github.event_name == 'schedule' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACCESS_DENIED_COUNT: ${{ steps.classify.outputs.access_denied_count }}
          ACCESS_DENIED_LINES: ${{ steps.classify.outputs.access_denied_lines }}
        run: |
          python3 <<'PY' > slack_payload.json
          import json
          import os
          from collections import defaultdict

          # Parse test failures from pytest report
          failures_by_folder = defaultdict(list)
          total_failures = 0

          try:
              with open('pytest-report.jsonl', 'r') as f:
                  for line in f:
                      try:
                          obj = json.loads(line)
                      except Exception:
                          continue
                      if obj.get('$report_type') != 'TestReport':
                          continue
                      if obj.get('when') != 'call':
                          continue
                      if obj.get('outcome') == 'failed':
                          nodeid = obj.get('nodeid', '<unknown>')
                          # Extract folder (e.g., "tests/livebench" from "tests/livebench/test_foo.py::test_bar")
                          parts = nodeid.split('/')
                          if len(parts) >= 2:
                              folder = '/'.join(parts[:2])
                          else:
                              folder = parts[0] if parts else '<root>'
                          failures_by_folder[folder].append(nodeid)
                          total_failures += 1
          except FileNotFoundError:
              pass

          # Count unmarked slow/docker tests
          unmarked_slow = 0
          unmarked_docker = 0
          try:
              with open('unmarked_slow_tests.txt', 'r') as f:
                  unmarked_slow = sum(1 for line in f if line.strip())
          except FileNotFoundError:
              pass
          try:
              with open('unmarked_docker_tests.txt', 'r') as f:
                  unmarked_docker = sum(1 for line in f if line.strip())
          except FileNotFoundError:
              pass

          # Build summary
          lines = []
          if total_failures:
              lines.append(f"*Test Failures:* {total_failures}")
              for folder in sorted(failures_by_folder.keys()):
                  count = len(failures_by_folder[folder])
                  lines.append(f"  • `{folder}`: {count} failed")
          if unmarked_slow:
              lines.append(f"*Unmarked slow tests:* {unmarked_slow}")
          if unmarked_docker:
              lines.append(f"*Unmarked docker tests:* {unmarked_docker}")
          access_denied_count = int(os.environ.get('ACCESS_DENIED_COUNT') or 0)
          if access_denied_count:
              lines.append("*Hugging Face access denied (accept the terms; no code fix):*")
              for entry in os.environ.get('ACCESS_DENIED_LINES', '').splitlines():
                  lines.append(f"  • {entry}")
          if not lines:
              lines.append("_Check run logs for details_")

          summary = '\n'.join(lines)
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          # Build title based on what failed
          issues = []
          if total_failures:
              issues.append(f"{total_failures} test failure{'s' if total_failures != 1 else ''}")
          if unmarked_slow:
              issues.append(f"{unmarked_slow} unmarked slow test{'s' if unmarked_slow != 1 else ''}")
          if unmarked_docker:
              issues.append(f"{unmarked_docker} unmarked docker test{'s' if unmarked_docker != 1 else ''}")
          title_summary = ', '.join(issues) if issues else 'issues detected'

          payload = {
              "text": f"⚠️ Heavy Tests Failed - {title_summary}",
              "blocks": [
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"*⚠️ Heavy Tests Failed*\n\n{summary}\n\n<{run_url}|View Run Details>"
                      }
                  }
              ]
          }

          print(json.dumps(payload))
          PY

          curl -X POST -H 'Content-type: application/json' \
            -d @slack_payload.json \
            "$SLACK_WEBHOOK_URL"

      - name: Dispatch failures to inspect_evals for automated fix
        if: ${{ always() && (steps.tests.outcome == 'failure' || steps.slow_check.outcome == 'failure' || steps.docker_check.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.INSPECT_EVALS_AUTOMATIC_FIX_TOKEN }}
        run: |
          python3 <<'PY' > dispatch_payload.json
          import json
          import math
          import os
          import subprocess
          import sys

          run_id = os.environ["GITHUB_RUN_ID"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"

          # --- Test failures that are not Hugging Face access denials ---
          result = subprocess.run(
              [
                  sys.executable,
                  "inspect-evals-actions/scripts/heavy/classify_failures.py",
                  "pytest-report.jsonl",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          test_failures = json.loads(result.stdout)["other_failures"]

          # --- Parse unmarked slow tests (format: "45.20s\tnodeid") ---
          slow_tests = []
          try:
              with open("unmarked_slow_tests.txt", "r") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      parts = line.split("\t", maxsplit=1)
                      if len(parts) == 2:
                          dur_str = parts[0].rstrip("s")
                          try:
                              dur = float(dur_str)
                          except ValueError:
                              dur = 0.0
                          slow_tests.append({
                              "node_id": parts[1],
                              "duration": dur,
                              "marker_value": math.ceil(dur),
                          })
          except FileNotFoundError:
              pass

          # --- Parse unmarked docker tests (format: one nodeid per line) ---
          docker_tests = []
          try:
              with open("unmarked_docker_tests.txt", "r") as f:
                  for line in f:
                      line = line.strip()
                      if line:
                          docker_tests.append({"node_id": line})
          except FileNotFoundError:
              pass

          if not any([test_failures, slow_tests, docker_tests]):
              print("No failures to dispatch.", file=sys.stderr)
              sys.exit(0)

          payload = {
              "run_id": run_id,
              "run_url": run_url,
              "test_failures": test_failures,
              "slow_tests": slow_tests,
              "docker_tests": docker_tests,
          }
          print(json.dumps(payload))
          PY

          if [ ! -s dispatch_payload.json ]; then
            echo "No dispatch payload generated — skipping."
            exit 0
          fi

          echo "Dispatch payload:"
          python3 -m json.tool dispatch_payload.json

          # Send repository_dispatch to inspect_evals
          jq -n --argjson payload "$(cat dispatch_payload.json)" \
            '{"event_type": "heavy-test-failure", "client_payload": $payload}' | \
            gh api repos/UKGovernmentBEIS/inspect_evals/dispatches --input -

      - name: Triage failed scheduled heavy test
        if: ${{ always() && github.event_name == 'schedule' && ((steps.tests.outcome == 'failure' && steps.classify.outputs.other_count != '0') || steps.slow_check.outcome == 'failure' || steps.docker_check.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.CI_TRIAGE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "CI_TRIAGE_DISPATCH_TOKEN is required" >&2
            exit 1
          fi
          gh api -X POST \
            repos/Generality-Labs/bienehito-experimental/dispatches \
            -f event_type=triage \
            -f "client_payload[prompt]=Triage failing nightly CI job 'Heavy tests (full suite)' in https://github.com/ArcadiaImpact/inspect-evals-actions/actions/runs/$GITHUB_RUN_ID"

  isolated-heavy-tests:
    # The isolated evals (packages/<eval>/ in inspect_evals) have dependencies
    # that conflict with the root environment, so heavy-tests ignores them and
    # they run here in their own tox envs. build.yml runs these envs on every PR
    # but without slow tests, dataset downloads or secrets.
    name: Heavy tests (isolated evals)
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 180
    env:
      RUN_SLOW_TESTS: yes
      RUN_DATASET_DOWNLOAD_TESTS: yes
      # cve_bench requires Python >= 3.12.
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout inspect_evals repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UKGovernmentBEIS/inspect_evals
          ref: ${{ inputs.inspect_evals_ref || '' }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-3.12-isolated-${{ hashFiles('packages/*/uv.lock', 'packages/*/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-3.12-isolated-
            ${{ runner.os }}-uv-3.12-

      - name: Install tox (locked dev group; no project build)
        run: uv sync --frozen --only-group dev --no-install-project

      - name: Run isolated eval tests via tox
        id: tests
        # One tox call per env so the failed envs can be listed in the Slack message.
        # tox.ini passes RUN_SLOW_TESTS, RUN_DATASET_DOWNLOAD_TESTS, HF_TOKEN and
        # KAGGLE_* through to each env.
        run: |
          failed=()
          for env in kernelbench novelty_bench livebench mle_bench cve_bench bold abstention_bench; do
            uv run --no-sync tox -e "$env" || failed+=("$env")
          done
          echo "failed_envs=${failed[*]}" >> "$GITHUB_OUTPUT"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed tox envs: ${failed[*]}" >&2
            exit 1
          fi

      - name: Notify Slack on scheduled failure
        if: ${{ always() && steps.tests.outcome == 'failure' && github.event_name == 'schedule' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FAILED_ENVS: ${{ steps.tests.outputs.failed_envs }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n --arg envs "$FAILED_ENVS" --arg url "$RUN_URL" \
            '{text: ("⚠️ Heavy Tests (isolated evals) failed: " + $envs + " - <" + $url + "|View run details>")}')
          curl -sS -X POST -H 'Content-type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL"

      - name: Triage failed scheduled heavy test
        if: ${{ always() && steps.tests.outcome == 'failure' && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.CI_TRIAGE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "CI_TRIAGE_DISPATCH_TOKEN is required" >&2
            exit 1
          fi
          gh api -X POST \
            repos/Generality-Labs/bienehito-experimental/dispatches \
            -f event_type=triage \
            -f "client_payload[prompt]=Triage failing nightly CI job 'Heavy tests (isolated evals)' in https://github.com/ArcadiaImpact/inspect-evals-actions/actions/runs/$GITHUB_RUN_ID"

